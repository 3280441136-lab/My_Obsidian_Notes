<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">联合熵与条件熵的分解关系</title>
  <desc id="desc">联合概率表按条件分组，联合熵可以按两种顺序分解。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 30px "Microsoft YaHei",sans-serif;fill:#172554}
      .head{font:700 21px "Microsoft YaHei",sans-serif;fill:#1d4ed8}
      .text{font:18px "Microsoft YaHei",sans-serif;fill:#1f2937}
      .formula{font:22px "Cambria Math","Times New Roman",serif;fill:#991b1b}
      .box{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:18}
      .cell{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="title" x="600" y="55" text-anchor="middle">联合熵：先确定谁，就先算谁，再加入条件熵</text>

  <rect class="cell" x="70" y="130" width="100" height="55"/>
  <rect class="cell" x="170" y="130" width="100" height="55"/>
  <rect class="cell" x="270" y="130" width="100" height="55"/>
  <rect class="cell" x="70" y="185" width="100" height="55"/>
  <rect class="cell" x="170" y="185" width="100" height="55"/>
  <rect class="cell" x="270" y="185" width="100" height="55"/>
  <foreignObject x="70" y="130" width="100" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:20px;color:#1f2937;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>p</mi><mn>11</mn></msub></math></div>
  </foreignObject>
  <foreignObject x="170" y="130" width="100" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:20px;color:#1f2937;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>p</mi><mn>12</mn></msub></math></div>
  </foreignObject>
  <foreignObject x="270" y="130" width="100" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:20px;color:#1f2937;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>p</mi><mn>13</mn></msub></math></div>
  </foreignObject>
  <foreignObject x="70" y="185" width="100" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:20px;color:#1f2937;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>p</mi><mn>21</mn></msub></math></div>
  </foreignObject>
  <foreignObject x="170" y="185" width="100" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:20px;color:#1f2937;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>p</mi><mn>22</mn></msub></math></div>
  </foreignObject>
  <foreignObject x="270" y="185" width="100" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:20px;color:#1f2937;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>p</mi><mn>23</mn></msub></math></div>
  </foreignObject>
  <text class="head" x="220" y="285" text-anchor="middle">联合概率表</text>

  <path d="M410 180 C500 180 510 125 590 125" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M410 180 C500 180 510 355 590 355" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box" x="595" y="85" width="530" height="130"/>
  <text class="head" x="625" y="125">先确定 X，再确定 Y</text>
  <foreignObject x="625" y="145" width="470" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Cambria Math','Times New Roman',serif;font-size:22px;color:#991b1b;white-space:nowrap;">
      <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
        <mrow>
          <mi>H</mi><mo>(</mo><mi>X</mi><mo>,</mo><mi>Y</mi><mo>)</mo>
          <mo>=</mo>
          <mi>H</mi><mo>(</mo><mi>X</mi><mo>)</mo>
          <mo>+</mo>
          <mi>H</mi><mo>(</mo><mi>Y</mi><mo mathvariant="normal">|</mo><mi>X</mi><mo>)</mo>
        </mrow>
      </math>
    </div>
  </foreignObject>

  <rect class="box" x="595" y="315" width="530" height="130"/>
  <text class="head" x="625" y="355">先确定 Y，再确定 X</text>
  <foreignObject x="625" y="375" width="470" height="70">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Cambria Math','Times New Roman',serif;font-size:22px;color:#991b1b;white-space:nowrap;">
      <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
        <mrow>
          <mi>H</mi><mo>(</mo><mi>X</mi><mo>,</mo><mi>Y</mi><mo>)</mo>
          <mo>=</mo>
          <mi>H</mi><mo>(</mo><mi>Y</mi><mo>)</mo>
          <mo>+</mo>
          <mi>H</mi><mo>(</mo><mi>X</mi><mo mathvariant="normal">|</mo><mi>Y</mi><mo>)</mo>
        </mrow>
      </math>
    </div>
  </foreignObject>

  <rect x="70" y="485" width="1055" height="175" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="head" x="100" y="535">条件熵的两层平均</text>
  <text class="text" x="100" y="568">已知谁，就按谁分组：先计算每组内部的熵，再按各组出现的概率求平均。</text>
  <foreignObject x="155" y="585" width="870" height="65">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:19px;color:#991b1b;white-space:nowrap;">
      <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
        <mrow>
          <mi>H</mi><mo>(</mo><mi>Y</mi><mo mathvariant="normal">|</mo><mi>X</mi><mo>)</mo>
          <mo>=</mo>
          <munder><mo>∑</mo><mi>i</mi></munder>
          <mi>P</mi><mo>(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>)</mo>
          <mi>H</mi><mo>(</mo><mi>Y</mi><mo mathvariant="normal">|</mo><msub><mi>x</mi><mi>i</mi></msub><mo>)</mo>
        </mrow>
      </math>
    </div>
  </foreignObject>
</svg>
