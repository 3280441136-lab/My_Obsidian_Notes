<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">无记忆信源的N次扩展</title>
  <desc id="desc">连续N次独立同分布输出的联合熵等于N倍单符号熵。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 30px "Microsoft YaHei",sans-serif;fill:#172554}
      .head{font:700 21px "Microsoft YaHei",sans-serif;fill:#1d4ed8}
      .text{font:18px "Microsoft YaHei",sans-serif;fill:#1f2937}
      .formula{font:24px "Cambria Math","Times New Roman",serif;fill:#991b1b}
      .box{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:18}
      .result{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="title" x="600" y="55" text-anchor="middle">把连续输出组合成大符号，不等于把随机变量做幂运算</text>

  <rect class="box" x="85" y="135" width="155" height="125"/>
  <rect class="box" x="275" y="135" width="155" height="125"/>
  <rect class="box" x="465" y="135" width="155" height="125"/>
  <rect class="box" x="655" y="135" width="155" height="125"/>
  <foreignObject x="95" y="150" width="135" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:28px;color:#991b1b;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>X</mi><mn>1</mn></msub></math></div>
  </foreignObject>
  <foreignObject x="285" y="150" width="135" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:28px;color:#991b1b;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>X</mi><mn>2</mn></msub></math></div>
  </foreignObject>
  <foreignObject x="475" y="150" width="135" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:28px;color:#991b1b;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>X</mi><mn>3</mn></msub></math></div>
  </foreignObject>
  <foreignObject x="665" y="150" width="135" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:28px;color:#991b1b;"><math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>X</mi><mi>N</mi></msub></math></div>
  </foreignObject>
  <text class="text" x="162" y="235" text-anchor="middle">第 1 次输出</text>
  <text class="text" x="352" y="235" text-anchor="middle">第 2 次输出</text>
  <text class="text" x="542" y="235" text-anchor="middle">第 3 次输出</text>
  <text class="text" x="732" y="235" text-anchor="middle">第 N 次输出</text>

  <text class="head" x="615" y="315" text-anchor="middle">独立同分布时，概率相乘，自信息相加</text>
  <path d="M450 335 C450 390 470 420 520 435" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="result" x="235" y="425" width="730" height="135"/>
  <foreignObject x="275" y="450" width="650" height="65">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:23px;color:#991b1b;white-space:nowrap;">
      <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
        <mrow>
          <mi>H</mi><mo>(</mo><msup><mi>X</mi><mi>N</mi></msup><mo>)</mo>
          <mo>=</mo>
          <mi>H</mi><mo>(</mo><msub><mi>X</mi><mn>1</mn></msub><mo>,</mo><mo>…</mo><mo>,</mo><msub><mi>X</mi><mi>N</mi></msub><mo>)</mo>
          <mo>=</mo><mi>N</mi><mi>H</mi><mo>(</mo><mi>X</mi><mo>)</mo>
        </mrow>
      </math>
    </div>
  </foreignObject>
  <text class="text" x="600" y="535" text-anchor="middle">把连续 N 次输出组合成一个长度为 N 的大符号</text>

  <rect x="125" y="590" width="950" height="85" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <foreignObject x="315" y="598" width="570" height="55">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-family:'Cambria Math','Times New Roman',serif;font-size:22px;color:#991b1b;white-space:nowrap;">
      <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
        <mrow>
          <mi>H</mi><mo>(</mo><msup><mi>X</mi><mi>N</mi></msup><mo>)</mo>
          <mo>≤</mo><mi>N</mi><mi>H</mi><mo>(</mo><mi>X</mi><mo>)</mo>
        </mrow>
      </math>
    </div>
  </foreignObject>
  <text class="small" x="600" y="658" text-anchor="middle">有记忆时一般成立；等号需要相互独立</text>
</svg>
