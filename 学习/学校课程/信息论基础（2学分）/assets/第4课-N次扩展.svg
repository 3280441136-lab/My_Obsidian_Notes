<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">无记忆信源的N次扩展</title>
  <desc id="desc">连续N次独立同分布输出的联合熵等于N倍单符号熵。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 30px "Microsoft YaHei",sans-serif;fill:#172554}
      .head{font:700 21px "Microsoft YaHei",sans-serif;fill:#1d4ed8}
      .text{font:18px "Microsoft YaHei",sans-serif;fill:#1f2937}
      .formula{font:24px "Cambria Math","Times New Roman",serif;fill:#991b1b}
      .box{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:18}
      .result{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="title" x="600" y="55" text-anchor="middle">把连续输出组合成大符号，不等于把随机变量做幂运算</text>

  <rect class="box" x="85" y="135" width="155" height="125"/>
  <rect class="box" x="275" y="135" width="155" height="125"/>
  <rect class="box" x="465" y="135" width="155" height="125"/>
  <rect class="box" x="655" y="135" width="155" height="125"/>
  <text class="formula" x="162" y="190" text-anchor="middle">\(X_1\)</text>
  <text class="formula" x="352" y="190" text-anchor="middle">\(X_2\)</text>
  <text class="formula" x="542" y="190" text-anchor="middle">\(X_3\)</text>
  <text class="formula" x="732" y="190" text-anchor="middle">\(X_N\)</text>
  <text class="text" x="162" y="230" text-anchor="middle">\(H(X)\)</text>
  <text class="text" x="352" y="230" text-anchor="middle">\(H(X)\)</text>
  <text class="text" x="542" y="230" text-anchor="middle">\(H(X)\)</text>
  <text class="text" x="732" y="230" text-anchor="middle">\(H(X)\)</text>

  <text class="head" x="615" y="315" text-anchor="middle">独立同分布时，概率相乘，自信息相加</text>
  <path d="M450 335 C450 390 470 420 520 435" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="result" x="235" y="425" width="730" height="135"/>
  <text class="formula" x="600" y="485" text-anchor="middle">\(H(X^N)=H(X_1,\ldots,X_N)=NH(X)\)</text>
  <text class="text" x="600" y="530" text-anchor="middle">\(X^N=(X_1,\ldots,X_N)\) 是一个长度为 \(N\) 的大符号</text>

  <rect x="125" y="605" width="950" height="55" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="text" x="600" y="640" text-anchor="middle">有记忆时一般只有 \(H(X^N)\leq NH(X)\)；等号依赖独立性</text>
</svg>
