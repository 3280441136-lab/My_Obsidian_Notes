<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.title{font:700 28px "Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:600 19px "Microsoft YaHei",sans-serif;fill:#0f172a}.small{font:16px "Microsoft YaHei",sans-serif;fill:#334155}.axis{stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.wave{stroke:#2563eb;stroke-width:3;fill:none}.lobe{stroke:#7c3aed;stroke-width:3;fill:#ede9fe;fill-opacity:.75}.guide{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}</style></defs>
  <rect width="1120" height="560" fill="#fff"/><text x="40" y="48" class="title">从连续频率到数字频率：DTFT 为什么以 2π 为周期</text>
  <text x="65" y="103" class="label">连续角频率 Ω</text><line x1="80" y1="185" x2="505" y2="185" class="axis"/><line x1="292" y1="235" x2="292" y2="118" class="axis"/><text x="505" y="211" class="small">Ω</text><text x="302" y="117" class="small">幅度</text><path d="M95 185 C155 185 175 125 235 125 C295 125 315 185 380 185 C425 185 445 160 485 160" class="lobe"/><text x="235" y="112" text-anchor="middle" class="small">连续频谱</text>
  <path d="M520 170 H635" class="axis"/><text x="577" y="145" text-anchor="middle" class="small">ω = ΩT_s</text>
  <text x="680" y="103" class="label">数字角频率 ω</text><line x1="675" y1="185" x2="1075" y2="185" class="axis"/><line x1="875" y1="235" x2="875" y2="118" class="axis"/><text x="1075" y="211" class="small">ω</text><text x="885" y="117" class="small">幅度</text><line x1="715" y1="125" x2="715" y2="215" class="guide"/><line x1="1035" y1="125" x2="1035" y2="215" class="guide"/><text x="715" y="238" text-anchor="middle" class="small">-π</text><text x="875" y="238" text-anchor="middle" class="small">0</text><text x="1035" y="238" text-anchor="middle" class="small">π</text><path d="M700 185 C755 185 775 130 835 130 C895 130 915 185 970 185 C1010 185 1030 162 1058 162" class="lobe"/>
  <text x="75" y="315" class="label">离散序列只能观察相邻样点的相位增量</text><path d="M115 420 C165 335 215 505 265 420 C315 335 365 505 415 420 C465 335 515 505 565 420 C615 335 665 505 715 420 C765 335 815 505 865 420 C915 335 965 505 1015 420" class="wave"/><g fill="#2563eb"><circle cx="115" cy="420" r="5"/><circle cx="165" cy="335" r="5"/><circle cx="215" cy="505" r="5"/><circle cx="265" cy="420" r="5"/><circle cx="315" cy="335" r="5"/><circle cx="365" cy="505" r="5"/><circle cx="415" cy="420" r="5"/><circle cx="465" cy="335" r="5"/><circle cx="515" cy="505" r="5"/><circle cx="565" cy="420" r="5"/><circle cx="615" cy="335" r="5"/><circle cx="665" cy="505" r="5"/><circle cx="715" cy="420" r="5"/><circle cx="765" cy="335" r="5"/><circle cx="815" cy="505" r="5"/><circle cx="865" cy="420" r="5"/><circle cx="915" cy="335" r="5"/><circle cx="965" cy="505" r="5"/><circle cx="1015" cy="420" r="5"/></g><text x="565" y="535" text-anchor="middle" class="small">ω 与 ω + 2π 给出相同的样点序列，因此 DTFT 必然以 2π 为周期</text>
</svg>
