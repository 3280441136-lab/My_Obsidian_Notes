<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-label="Impulse identity and shift properties">
  <style>
    .axis { stroke: #718096; stroke-width: 2; }
    .stem { stroke: #2f80d0; stroke-width: 3; }
    .stem2 { stroke: #e8892f; stroke-width: 3; }
    .dot { fill: #2f80d0; }
    .dot2 { fill: #e8892f; }
    .label { fill: #263b50; font: 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .math { fill: #1d4770; font: italic 20px Georgia, serif; }
    .title { fill: #1d4770; font: 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-weight: 700; }
  </style>
  <rect x="0" y="0" width="760" height="270" fill="#fbfcfe"/>
  <text class="title" x="20" y="28">&#x5355;&#x4f4d;&#x51b2;&#x6fc0;&#xff1a;&#x5355;&#x4f4d;&#x5143;&#x4e0e;&#x79fb;&#x4f4d;</text>
  <text class="math" x="25" y="72">&#x03b4;[n]</text>
  <line class="axis" x1="145" y1="78" x2="700" y2="78"/>
  <line class="stem2" x1="300" y1="78" x2="300" y2="35"/><circle class="dot2" cx="300" cy="35" r="6"/>
  <text class="label" x="294" y="101">0</text>
  <text class="math" x="25" y="137">x[n] * &#x03b4;[n]</text>
  <text class="math" x="350" y="137">= x[n]</text>
  <text class="label" x="25" y="163">&#x552f;&#x4e00;&#x975e;&#x96f6;&#x9879;&#x5728; m = 0</text>
  <line class="axis" x1="145" y1="205" x2="700" y2="205"/>
