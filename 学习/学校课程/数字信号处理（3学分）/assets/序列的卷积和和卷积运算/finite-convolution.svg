<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="Finite length convolution of four ones">
  <style>
    .axis { stroke: #263238; stroke-width: 2; }
    .bar { fill: #dbeafe; stroke: #1565c0; stroke-width: 2; }
    .result { fill: #ffedd5; stroke: #ef6c00; stroke-width: 2; }
    .label { fill: #263238; font: 17px sans-serif; }
    .math { fill: #102a43; font: italic 20px Georgia, serif; }
    .title { fill: #102a43; font: 20px sans-serif; font-weight: 700; }
  </style>
  <text class="title" x="20" y="28">Finite convolution: align, multiply, add</text>
  <text class="math" x="22" y="75">x[n] = h[n] = R4[n] = {1,1,1,1}</text>
  <text class="label" x="42" y="112">x</text>
  <rect class="bar" x="95" y="92" width="72" height="34"/><rect class="bar" x="167" y="92" width="72" height="34"/><rect class="bar" x="239" y="92" width="72" height="34"/><rect class="bar" x="311" y="92" width="72" height="34"/>
  <text class="label" x="126" y="116">1</text><text class="label" x="198" y="116">1</text><text class="label" x="270" y="116">1</text><text class="label" x="342" y="116">1</text>
  <text class="label" x="42" y="162">h</text>
  <rect class="bar" x="95" y="142" width="72" height="34"/><rect class="bar" x="167" y="142" width="72" height="34"/><rect class="bar" x="239" y="142" width="72" height="34"/><rect class="bar" x="311" y="142" width="72" height="34"/>
  <text class="label" x="126" y="166">1</text><text class="label" x="198" y="166">1</text><text class="label" x="270" y="166">1</text><text class="label" x="342" y="166">1</text>
  <text class="label" x="420" y="163">Each diagonal/column collects one output index.</text>
  <line class="axis" x1="95" y1="207" x2="455" y2="207"/>
  <text class="math" x="22" y="247">y[n]</text>
  <rect class="result" x="95" y="224" width="48" height="34"/><rect class="result" x="143" y="224" width="48" height="34"/><rect class="result" x="191" y="224" width="48" height="34"/><rect class="result" x="239" y="224" width="48" height="34"/><rect class="result" x="287" y="224" width="48" height="34"/><rect class="result" x="335" y="224" width="48" height="34"/><rect class="result" x="383" y="224" width="48" height="34"/>
  <text class="label" x="114" y="248">1</text><text class="label" x="162" y="248">2</text><text class="label" x="210" y="248">3</text><text class="label" x="258" y="248">4</text><text class="label" x="306" y="248">3</text><text class="label" x="354" y="248">2</text><text class="label" x="402" y="248">1</text>
  <text class="label" x="100" y="288">Length: 4 + 4 - 1 = 7</text>
</svg>
