<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">有限长序列的卷积</title>
  <desc id="desc">两个长度为四的全一序列，经过逐项相乘并按同一输出索引相加，得到长度为七的结果。</desc>
  <style>
    .title { fill: #17324d; font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .section { fill: #315a7d; font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .label { fill: #243746; font: 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .index { fill: #4b6070; font: 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .value { fill: #172b3a; font: 700 23px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .cell { fill: #e6f0ff; stroke: #3776bd; stroke-width: 2; }
    .cell2 { fill: #fff0dc; stroke: #d97927; stroke-width: 2; }
    .cell3 { fill: #e7f6ed; stroke: #3b9460; stroke-width: 2; }
    .line { stroke: #8b9aa7; stroke-width: 2; }
    .arrow { stroke: #315a7d; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    .note { fill: #526575; font: 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#315a7d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#fbfcfe"/>
  <text class="title" x="32" y="42">有限长序列卷积：对齐、相乘、相加</text>

  <text class="section" x="32" y="88">① 两个输入序列</text>
  <text class="label" x="55" y="130">x[n]</text>
  <g transform="translate(135,105)">
    <rect class="cell" x="0" y="0" width="100" height="48"/><rect class="cell" x="100" y="0" width="100" height="48"/><rect class="cell" x="200" y="0" width="100" height="48"/><rect class="cell" x="300" y="0" width="100" height="48"/>
    <text class="value" x="50" y="24">1</text><text class="value" x="150" y="24">1</text><text class="value" x="250" y="24">1</text><text class="value" x="350" y="24">1</text>
    <text class="index" x="46" y="70">0</text><text class="index" x="146" y="70">1</text><text class="index" x="246" y="70">2</text><text class="index" x="346" y="70">3</text>
  </g>
  <text class="label" x="55" y="225">h[n]</text>
  <g transform="translate(135,200)">
    <rect class="cell" x="0" y="0" width="100" height="48"/><rect class="cell" x="100" y="0" width="100" height="48"/><rect class="cell" x="200" y="0" width="100" height="48"/><rect class="cell" x="300" y="0" width="100" height="48"/>
    <text class="value" x="50" y="24">1</text><text class="value" x="150" y="24">1</text><text class="value" x="250" y="24">1</text><text class="value" x="350" y="24">1</text>
    <text class="index" x="46" y="70">0</text><text class="index" x="146" y="70">1</text><text class="index" x="246" y="70">2</text><text class="index" x="346" y="70">3</text>
  </g>

  <path class="arrow" d="M 600 145 L 770 145"/>
  <text class="note" x="590" y="125">逐项相乘</text>
  <text class="note" x="590" y="178">再按同一 n 相加</text>

  <line class="line" x1="40" y1="292" x2="860" y2="292"/>
  <text class="section" x="32" y="332">② 输出序列：重叠长度先增后减</text>
  <text class="label" x="55" y="385">y[n]</text>
  <g transform="translate(135,350)">
    <rect class="cell2" x="0" y="0" width="90" height="52"/><rect class="cell2" x="90" y="0" width="90" height="52"/><rect class="cell2" x="180" y="0" width="90" height="52"/><rect class="cell2" x="270" y="0" width="90" height="52"/><rect class="cell2" x="360" y="0" width="90" height="52"/><rect class="cell2" x="450" y="0" width="90" height="52"/><rect class="cell2" x="540" y="0" width="90" height="52"/>
    <text class="value" x="45" y="26">1</text><text class="value" x="135" y="26">2</text><text class="value" x="225" y="26">3</text><text class="value" x="315" y="26">4</text><text class="value" x="405" y="26">3</text><text class="value" x="495" y="26">2</text><text class="value" x="585" y="26">1</text>
    <text class="index" x="41" y="76">0</text><text class="index" x="131" y="76">1</text><text class="index" x="221" y="76">2</text><text class="index" x="311" y="76">3</text><text class="index" x="401" y="76">4</text><text class="index" x="491" y="76">5</text><text class="index" x="581" y="76">6</text>
  </g>
  <rect class="cell3" x="650" y="448" width="190" height="38" rx="6"/>
  <text class="note" x="665" y="473">长度 4 + 4 − 1 = 7</text>
</svg>
