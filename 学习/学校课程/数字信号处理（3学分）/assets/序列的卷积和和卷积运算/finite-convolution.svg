<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
  <title id="title">&#x6709;&#x9650;&#x957f;&#x5e8f;&#x5217;&#x5377;&#x79ef;&#xff1a;&#x50cf;&#x5c0f;&#x5b66;&#x4e58;&#x6cd5;&#x4e00;&#x6837;&#x8ba1;&#x7b97;</title>
  <desc id="desc">&#x6bcf;&#x4e00;&#x884c;&#x90fd;&#x662f;&#x53f3;&#x79fb;&#x540e;&#x7684;&#x90e8;&#x5206;&#x79ef;&#xff0c;&#x6700;&#x540e;&#x6309;&#x5217;&#x76f8;&#x52a0;&#x5f97;&#x5230; 1, 2, 3, 4, 3, 2, 1.</desc>
  <style>
    .title { fill: #17324d; font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .section { fill: #315a7d; font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .label { fill: #243746; font: 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { fill: #526575; font: 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .value { fill: #172b3a; font: 700 22px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .sum { fill: #172b3a; font: 700 23px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .input { fill: #e6f0ff; stroke: #3776bd; stroke-width: 2; }
    .partial-a { fill: #f5f8fc; stroke: #7d98b3; stroke-width: 1.5; }
    .partial-b { fill: #eef5ff; stroke: #7d98b3; stroke-width: 1.5; }
    .result { fill: #fff0dc; stroke: #d97927; stroke-width: 2; }
    .line { stroke: #4b6070; stroke-width: 2.5; }
    .guide { stroke: #c3ced8; stroke-width: 1; stroke-dasharray: 4 5; }
    .arrow { stroke: #315a7d; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#315a7d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="650" fill="#fbfcfe"/>
  <text class="title" x="34" y="42">Finite convolution: school-style column calculation</text>

  <text class="section" x="34" y="86">1. Write the two sequences</text>
  <text class="label" x="75" y="128">x[n]</text>
  <g transform="translate(180,101)">
    <rect class="input" x="0" y="0" width="75" height="48"/><rect class="input" x="75" y="0" width="75" height="48"/><rect class="input" x="150" y="0" width="75" height="48"/><rect class="input" x="225" y="0" width="75" height="48"/>
    <text class="value" x="37.5" y="24">1</text><text class="value" x="112.5" y="24">1</text><text class="value" x="187.5" y="24">1</text><text class="value" x="262.5" y="24">1</text>
    <text class="small" x="32" y="70">0</text><text class="small" x="107" y="70">1</text><text class="small" x="182" y="70">2</text><text class="small" x="257" y="70">3</text>
  </g>
  <text class="label" x="75" y="225">h[n]</text>
  <g transform="translate(180,198)">
    <rect class="input" x="0" y="0" width="75" height="48"/><rect class="input" x="75" y="0" width="75" height="48"/><rect class="input" x="150" y="0" width="75" height="48"/><rect class="input" x="225" y="0" width="75" height="48"/>
    <text class="value" x="37.5" y="24">1</text><text class="value" x="112.5" y="24">1</text><text class="value" x="187.5" y="24">1</text><text class="value" x="262.5" y="24">1</text>
    <text class="small" x="32" y="70">0</text><text class="small" x="107" y="70">1</text><text class="small" x="182" y="70">2</text><text class="small" x="257" y="70">3</text>
  </g>
  <path class="arrow" d="M 540 175 L 725 175"/>
  <text class="small" x="545" y="150">Each next row shifts right</text>
  <text class="small" x="545" y="205">Then add by columns</text>

  <line class="line" x1="45" y1="286" x2="995" y2="286"/>
  <text class="section" x="34" y="325">2. Write the shifted partial products</text>
  <text class="small" x="760" y="325">All products are 1 * 1 = 1</text>

  <g>
    <line class="guide" x1="180" y1="340" x2="180" y2="590"/><line class="guide" x1="255" y1="340" x2="255" y2="590"/><line class="guide" x1="330" y1="340" x2="330" y2="590"/><line class="guide" x1="405" y1="340" x2="405" y2="590"/><line class="guide" x1="480" y1="340" x2="480" y2="590"/><line class="guide" x1="555" y1="340" x2="555" y2="590"/><line class="guide" x1="630" y1="340" x2="630" y2="590"/><line class="guide" x1="705" y1="340" x2="705" y2="590"/>
    <text class="label" x="75" y="365">h[0]x</text>
    <rect class="partial-a" x="180" y="340" width="75" height="42"/><rect class="partial-a" x="255" y="340" width="75" height="42"/><rect class="partial-a" x="330" y="340" width="75" height="42"/><rect class="partial-a" x="405" y="340" width="75" height="42"/>
    <text class="value" x="217.5" y="361">1</text><text class="value" x="292.5" y="361">1</text><text class="value" x="367.5" y="361">1</text><text class="value" x="442.5" y="361">1</text>

    <text class="label" x="75" y="415">h[1]x</text>
    <rect class="partial-b" x="255" y="390" width="75" height="42"/><rect class="partial-b" x="330" y="390" width="75" height="42"/><rect class="partial-b" x="405" y="390" width="75" height="42"/><rect class="partial-b" x="480" y="390" width="75" height="42"/>
    <text class="value" x="292.5" y="411">1</text><text class="value" x="367.5" y="411">1</text><text class="value" x="442.5" y="411">1</text><text class="value" x="517.5" y="411">1</text>

    <text class="label" x="75" y="465">h[2]x</text>
    <rect class="partial-a" x="330" y="440" width="75" height="42"/><rect class="partial-a" x="405" y="440" width="75" height="42"/><rect class="partial-a" x="480" y="440" width="75" height="42"/><rect class="partial-a" x="555" y="440" width="75" height="42"/>
    <text class="value" x="367.5" y="461">1</text><text class="value" x="442.5" y="461">1</text><text class="value" x="517.5" y="461">1</text><text class="value" x="592.5" y="461">1</text>

    <text class="label" x="75" y="515">h[3]x</text>
    <text class="label" x="145" y="515">+</text>
    <rect class="partial-b" x="405" y="490" width="75" height="42"/><rect class="partial-b" x="480" y="490" width="75" height="42"/><rect class="partial-b" x="555" y="490" width="75" height="42"/><rect class="partial-b" x="630" y="490" width="75" height="42"/>
    <text class="value" x="442.5" y="511">1</text><text class="value" x="517.5" y="511">1</text><text class="value" x="592.5" y="511">1</text><text class="value" x="667.5" y="511">1</text>
  </g>

  <line class="line" x1="180" y1="550" x2="705" y2="550"/>
  <text class="section" x="34" y="590">3. Add each column</text>
  <g transform="translate(180,565)">
    <rect class="result" x="0" y="0" width="75" height="48"/><rect class="result" x="75" y="0" width="75" height="48"/><rect class="result" x="150" y="0" width="75" height="48"/><rect class="result" x="225" y="0" width="75" height="48"/><rect class="result" x="300" y="0" width="75" height="48"/><rect class="result" x="375" y="0" width="75" height="48"/><rect class="result" x="450" y="0" width="75" height="48"/>
    <text class="sum" x="37.5" y="24">1</text><text class="sum" x="112.5" y="24">2</text><text class="sum" x="187.5" y="24">3</text><text class="sum" x="262.5" y="24">4</text><text class="sum" x="337.5" y="24">3</text><text class="sum" x="412.5" y="24">2</text><text class="sum" x="487.5" y="24">1</text>
  </g>
  <text class="small" x="760" y="590">y[n] = {1, 2, 3, 4, 3, 2, 1}</text>
  <text class="small" x="760" y="615">length = 4 + 4 - 1 = 7</text>
</svg>
