<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#344054"/>
    </marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="coral-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#e05252"/>
    </marker>
    <style>
      .title { font: 700 28px "Microsoft YaHei", sans-serif; fill: #111827; }
      .subtitle { font: 700 21px "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .label { font: 17px "Microsoft YaHei", sans-serif; fill: #344054; }
      .small { font: 15px "Microsoft YaHei", sans-serif; fill: #475467; }
      .axis { stroke: #344054; stroke-width: 2; }
      .tick { stroke: #667085; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="60" y="52" class="title">实余弦与真正单边复信号的频谱</text>

  <rect x="55" y="85" width="1090" height="235" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
  <text x="85" y="125" class="subtitle">实余弦：正、负频率必须成对</text>
  <text x="85" y="154" class="small">x(t) = A cos(Omega_0 t + phi)</text>
  <line x1="120" y1="255" x2="1080" y2="255" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="600" y1="280" x2="600" y2="180" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="355" y1="262" x2="355" y2="248" class="tick"/>
  <line x1="845" y1="262" x2="845" y2="248" class="tick"/>
  <line x1="355" y1="253" x2="355" y2="188" stroke="#2563eb" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <line x1="845" y1="253" x2="845" y2="188" stroke="#2563eb" stroke-width="5" marker-end="url(#blue-arrow)"/>
  <path d="M410 174 C500 135, 700 135, 790 174" fill="none" stroke="#e05252" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="510" y="139" class="label" fill="#e05252">共轭成对，幅度对称</text>
  <text x="324" y="289" class="label">-Omega_0</text>
  <text x="822" y="289" class="label">+Omega_0</text>
  <text x="588" y="303" class="label">0</text>
  <text x="1065" y="287" class="label">Omega</text>
  <text x="617" y="188" class="small">幅度</text>

  <rect x="55" y="350" width="1090" height="235" rx="8" fill="#fffaf5" stroke="#d0d5dd"/>
  <text x="85" y="390" class="subtitle">真正单边的复信号：负频率实际为零</text>
  <text x="85" y="419" class="small">x_c(t) = exp(j Omega_0 t)</text>
  <line x1="120" y1="520" x2="1080" y2="520" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="600" y1="545" x2="600" y2="445" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="355" y1="527" x2="355" y2="513" class="tick"/>
  <line x1="845" y1="527" x2="845" y2="513" class="tick"/>
  <line x1="845" y1="518" x2="845" y2="453" stroke="#e05252" stroke-width="5" marker-end="url(#coral-arrow)"/>
  <text x="270" y="480" class="label" fill="#667085">这一侧为零</text>
  <line x1="300" y1="490" x2="465" y2="490" stroke="#667085" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="324" y="554" class="label">-Omega_0</text>
  <text x="822" y="554" class="label">+Omega_0</text>
  <text x="588" y="568" class="label">0</text>
  <text x="1065" y="552" class="label">Omega</text>
  <text x="617" y="453" class="small">幅度</text>
  <text x="60" y="625" class="small">注意：复信号可以是单边谱，也可以同时含正、负频率；“复信号”本身并不保证单边。</text>
</svg>
