<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520">
  <rect width="700" height="520" fill="#fffdf7"/>
  <style>
    .axis{stroke:#49515c;stroke-width:2}.circle{fill:none;stroke:#718096;stroke-width:2}.ray{stroke:#2f6f9f;stroke-width:3}.label{font:18px sans-serif;fill:#20252b}.title{font:22px sans-serif;font-weight:700;fill:#20252b}.angle{font:16px sans-serif;fill:#bb5a3c}
  </style>
  <text x="30" y="38" class="title">N=4 的旋转因子</text>
  <circle cx="350" cy="275" r="165" class="circle"/>
  <line x1="135" y1="275" x2="565" y2="275" class="axis"/><line x1="350" y1="60" x2="350" y2="490" class="axis"/>
  <line x1="350" y1="275" x2="515" y2="275" class="ray"/><line x1="350" y1="275" x2="350" y2="110" class="ray"/><line x1="350" y1="275" x2="185" y2="275" class="ray"/><line x1="350" y1="275" x2="350" y2="440" class="ray"/>
  <circle cx="515" cy="275" r="7" fill="#2f6f9f"/><circle cx="350" cy="110" r="7" fill="#2f6f9f"/><circle cx="185" cy="275" r="7" fill="#2f6f9f"/><circle cx="350" cy="440" r="7" fill="#2f6f9f"/>
  <text x="525" y="268" class="label">W₄⁰=1</text><text x="365" y="102" class="label">W₄¹=-j</text><text x="92" y="268" class="label">W₄²=-1</text><text x="365" y="465" class="label">W₄³=j</text>
  <text x="416" y="230" class="angle">顺时针 π/2</text><text x="358" y="70" class="angle">旋转一周后回到 W₄⁰</text>
  <text x="40" y="500" class="label">W₄=e^(-jπ/2)，每次旋转 2π/N</text>
</svg>
