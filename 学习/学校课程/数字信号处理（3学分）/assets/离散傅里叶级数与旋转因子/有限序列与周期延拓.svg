<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <rect width="1000" height="430" fill="#fffdf7"/>
  <style>
    .axis{stroke:#39414d;stroke-width:2}.grid{stroke:#d7dbe2;stroke-width:1}.label{font:16px sans-serif;fill:#20252b}.title{font:20px sans-serif;font-weight:700;fill:#20252b}.sample{fill:#2f6f9f}.repeat{fill:#bb5a3c}.guide{stroke:#bb5a3c;stroke-width:2;stroke-dasharray:7 5}
  </style>
  <text x="35" y="35" class="title">有限长序列与周期延拓（主值为 [1, 2, 3, 0]）</text>
  <text x="35" y="82" class="label">有限序列：区间外补零</text>
  <line x1="90" y1="160" x2="940" y2="160" class="axis"/>
  <g class="grid">
    <line x1="190" y1="95" x2="190" y2="175"/><line x1="290" y1="95" x2="290" y2="175"/><line x1="390" y1="95" x2="390" y2="175"/><line x1="490" y1="95" x2="490" y2="175"/><line x1="590" y1="95" x2="590" y2="175"/><line x1="690" y1="95" x2="690" y2="175"/><line x1="790" y1="95" x2="790" y2="175"/>
  </g>
  <line x1="390" y1="160" x2="390" y2="105" class="sample"/><circle cx="390" cy="105" r="6" class="sample"/><text x="382" y="190" class="label">0: 1</text>
  <line x1="490" y1="160" x2="490" y2="65" class="sample"/><circle cx="490" cy="65" r="6" class="sample"/><text x="482" y="190" class="label">1: 2</text>
  <line x1="590" y1="160" x2="590" y2="25" class="sample"/><circle cx="590" cy="25" r="6" class="sample"/><text x="582" y="190" class="label">2: 3</text>
  <text x="625" y="150" class="label">3 及其余位置：0</text>
  <text x="35" y="250" class="label">周期延拓：每四个样点重复一次</text>
  <line x1="90" y1="370" x2="940" y2="370" class="axis"/>
  <g>
    <line x1="90" y1="370" x2="90" y2="315" class="repeat"/><circle cx="90" cy="315" r="6" class="repeat"/>
    <line x1="190" y1="370" x2="190" y2="275" class="repeat"/><circle cx="190" cy="275" r="6" class="repeat"/>
    <line x1="290" y1="370" x2="290" y2="235" class="repeat"/><circle cx="290" cy="235" r="6" class="repeat"/>
    <line x1="390" y1="370" x2="390" y2="370" class="repeat"/>
    <line x1="490" y1="370" x2="490" y2="315" class="repeat"/><circle cx="490" cy="315" r="6" class="repeat"/>
    <line x1="590" y1="370" x2="590" y2="275" class="repeat"/><circle cx="590" cy="275" r="6" class="repeat"/>
    <line x1="690" y1="370" x2="690" y2="235" class="repeat"/><circle cx="690" cy="235" r="6" class="repeat"/>
    <line x1="790" y1="370" x2="790" y2="370" class="repeat"/>
    <line x1="890" y1="370" x2="890" y2="315" class="repeat"/><circle cx="890" cy="315" r="6" class="repeat"/>
  </g>
  <line x1="390" y1="215" x2="390" y2="385" class="guide"/><line x1="790" y1="215" x2="790" y2="385" class="guide"/>
  <text x="340" y="415" class="label">一个周期 N=4</text><text x="735" y="415" class="label">下一个周期</text>
</svg>
