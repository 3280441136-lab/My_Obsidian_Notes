  <text x="230" y="198" text-anchor="middle" font-size="23" font-family="Microsoft YaHei, sans-serif" fill="#24546b">圆内不收敛</text>
  <text x="710" y="198" text-anchor="middle" font-size="23" font-family="Microsoft YaHei, sans-serif" fill="#24546b">圆内收敛</text>
