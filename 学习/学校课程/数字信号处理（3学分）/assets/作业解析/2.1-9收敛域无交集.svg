  <text x="710" y="36" text-anchor="middle" font-size="23" font-family="Microsoft YaHei, sans-serif" fill="#1d3340">负时间部分</text>
  <rect x="40" y="58" width="380" height="294" fill="#dceff5" stroke="#506570"/>
  <rect x="520" y="58" width="380" height="294" fill="#ffffff" stroke="#506570"/>
  <line x1="230" y1="58" x2="230" y2="352" stroke="#9aa9ae"/>
  <line x1="40" y1="205" x2="420" y2="205" stroke="#9aa9ae"/>
  <line x1="710" y1="58" x2="710" y2="352" stroke="#9aa9ae"/>
