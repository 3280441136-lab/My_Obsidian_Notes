<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">五类典型离散时间序列</title>
  <desc id="desc">单位冲激、单位阶跃、长度五的矩形、指数衰减和余弦离散序列的茎状图</desc>
  <style>
    .panel{fill:#fff;stroke:#a8b3bd;stroke-width:2}.axis{stroke:#4b5965;stroke-width:2}.tick{stroke:#7d8b96;stroke-width:1}.stem{stroke:#187c70;stroke-width:5;stroke-linecap:round}.stem2{stroke:#c84c36;stroke-width:5;stroke-linecap:round}.dot{fill:#187c70}.dot2{fill:#c84c36}.h{font:700 23px Arial,sans-serif;fill:#17324d}.label{font:18px Arial,sans-serif;fill:#263746}.small{font:15px Arial,sans-serif;fill:#526372}.zero{font:15px Arial,sans-serif;fill:#526372}
  </style>
  <rect width="1200" height="790" fill="#f5f8fa"/>
  <text x="60" y="48" class="h" style="font-size:30px">常见典型离散序列（每根竖线是一个样点）</text>
  <g transform="translate(55 85)">
    <rect class="panel" width="340" height="290" rx="8"/><text x="22" y="34" class="h">单位冲激 δ[n]</text>
    <line class="axis" x1="40" y1="210" x2="310" y2="210"/><line class="axis" x1="160" y1="65" x2="160" y2="245"/>
    <g class="tick"><line x1="80" y1="205" x2="80" y2="215"/><line x1="120" y1="205" x2="120" y2="215"/><line x1="200" y1="205" x2="200" y2="215"/><line x1="240" y1="205" x2="240" y2="215"/></g>
    <line class="stem2" x1="160" y1="210" x2="160" y2="105"/><circle class="dot2" cx="160" cy="105" r="6"/>
    <text x="70" y="235" class="small">−2</text><text x="112" y="235" class="small">−1</text><text x="156" y="235" class="zero">0</text><text x="197" y="235" class="small">1</text><text x="237" y="235" class="small">2</text><text x="166" y="110" class="small">1</text><text x="314" y="214" class="label">n</text>
  </g>
  <g transform="translate(430 85)">
    <rect class="panel" width="340" height="290" rx="8"/><text x="22" y="34" class="h">单位阶跃 u[n]</text>
    <line class="axis" x1="40" y1="210" x2="310" y2="210"/><line class="axis" x1="135" y1="65" x2="135" y2="245"/>
    <g class="stem"><line x1="135" y1="210" x2="135" y2="115"/><line x1="170" y1="210" x2="170" y2="115"/><line x1="205" y1="210" x2="205" y2="115"/><line x1="240" y1="210" x2="240" y2="115"/><line x1="275" y1="210" x2="275" y2="115"/></g>
    <g class="dot"><circle cx="135" cy="115" r="6"/><circle cx="170" cy="115" r="6"/><circle cx="205" cy="115" r="6"/><circle cx="240" cy="115" r="6"/><circle cx="275" cy="115" r="6"/></g>
    <text x="87" y="235" class="small">−1</text><text x="130" y="235" class="zero">0</text><text x="166" y="235" class="small">1</text><text x="201" y="235" class="small">2</text><text x="236" y="235" class="small">3</text><text x="271" y="235" class="small">4</text><text x="142" y="110" class="small">1</text><text x="314" y="214" class="label">n</text>
  </g>
  <g transform="translate(805 85)">
    <rect class="panel" width="340" height="290" rx="8"/><text x="22" y="34" class="h">矩形 r₅[n]</text>
    <line class="axis" x1="40" y1="210" x2="310" y2="210"/><line class="axis" x1="95" y1="65" x2="95" y2="245"/>
    <g class="stem"><line x1="95" y1="210" x2="95" y2="115"/><line x1="135" y1="210" x2="135" y2="115"/><line x1="175" y1="210" x2="175" y2="115"/><line x1="215" y1="210" x2="215" y2="115"/><line x1="255" y1="210" x2="255" y2="115"/></g>
    <g class="dot"><circle cx="95" cy="115" r="6"/><circle cx="135" cy="115" r="6"/><circle cx="175" cy="115" r="6"/><circle cx="215" cy="115" r="6"/><circle cx="255" cy="115" r="6"/></g>
    <text x="90" y="235" class="zero">0</text><text x="131" y="235" class="small">1</text><text x="171" y="235" class="small">2</text><text x="211" y="235" class="small">3</text><text x="251" y="235" class="small">4</text><text x="102" y="110" class="small">1</text><text x="314" y="214" class="label">n</text>
  </g>
  <g transform="translate(245 440)">
    <rect class="panel" width="340" height="290" rx="8"/><text x="22" y="34" class="h">指数衰减 (0.65)ⁿu[n]</text>
    <line class="axis" x1="40" y1="210" x2="310" y2="210"/><line class="axis" x1="95" y1="65" x2="95" y2="245"/>
    <g class="stem2"><line x1="95" y1="210" x2="95" y2="105"/><line x1="135" y1="210" x2="135" y2="142"/><line x1="175" y1="210" x2="175" y2="166"/><line x1="215" y1="210" x2="215" y2="182"/><line x1="255" y1="210" x2="255" y2="191"/></g>
    <g class="dot2"><circle cx="95" cy="105" r="6"/><circle cx="135" cy="142" r="6"/><circle cx="175" cy="166" r="6"/><circle cx="215" cy="182" r="6"/><circle cx="255" cy="191" r="6"/></g>
    <text x="90" y="235" class="zero">0</text><text x="131" y="235" class="small">1</text><text x="171" y="235" class="small">2</text><text x="211" y="235" class="small">3</text><text x="251" y="235" class="small">4</text><text x="103" y="102" class="small">1</text><text x="314" y="214" class="label">n</text>
  </g>
  <g transform="translate(620 440)">
    <rect class="panel" width="340" height="290" rx="8"/><text x="22" y="34" class="h">余弦 cos(πn/3)</text>
    <line class="axis" x1="35" y1="155" x2="310" y2="155"/><line class="axis" x1="65" y1="65" x2="65" y2="245"/>
    <g class="stem"><line x1="65" y1="155" x2="65" y2="85"/><line x1="105" y1="155" x2="105" y2="120"/><line x1="145" y1="155" x2="145" y2="225"/><line x1="185" y1="155" x2="185" y2="245"/><line x1="225" y1="155" x2="225" y2="225"/><line x1="265" y1="155" x2="265" y2="120"/></g>
    <g class="dot"><circle cx="65" cy="85" r="6"/><circle cx="105" cy="120" r="6"/><circle cx="145" cy="225" r="6"/><circle cx="185" cy="245" r="6"/><circle cx="225" cy="225" r="6"/><circle cx="265" cy="120" r="6"/></g>
    <text x="60" y="275" class="zero">0</text><text x="101" y="275" class="small">1</text><text x="141" y="275" class="small">2</text><text x="181" y="275" class="small">3</text><text x="221" y="275" class="small">4</text><text x="261" y="275" class="small">5</text><text x="70" y="86" class="small">1</text><text x="313" y="159" class="label">n</text>
  </g>
</svg>
