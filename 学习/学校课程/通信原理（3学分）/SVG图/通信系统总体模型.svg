<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">通信系统总体模型</title>
  <desc id="desc">信息源产生消息，发送设备把消息变成适合信道传输的信号，信道引入噪声，接收设备恢复消息并交给信息用户。</desc>
  <defs>
    <style>
      .title { font: 700 36px "Microsoft YaHei", sans-serif; fill: #17324d; }
      .h { font: 700 25px "Microsoft YaHei", sans-serif; fill: #17324d; }
      .t { font: 20px "Microsoft YaHei", sans-serif; fill: #243b53; }
      .s { font: 16px "Microsoft YaHei", sans-serif; fill: #52677b; }
      .box { fill: #f8fbff; stroke: #3478c6; stroke-width: 3; rx: 10; }
      .core { fill: #eaf4ff; stroke: #1864ab; stroke-width: 4; rx: 12; }
      .noise { fill: #fff2f0; stroke: #d94841; stroke-width: 3; rx: 10; }
      .arrow { fill: none; stroke: #1864ab; stroke-width: 5; marker-end: url(#a); }
      .noise-arrow { fill: none; stroke: #d94841; stroke-width: 4; marker-end: url(#n); }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#1864ab"/></marker>
    <marker id="n" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#d94841"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="65" y="62" class="title">通信系统总体模型：从消息到信号，再恢复消息</text>

  <rect x="55" y="165" width="185" height="125" class="box"/>
  <text x="147" y="213" text-anchor="middle" class="h">信息源</text>
  <text x="147" y="246" text-anchor="middle" class="t">Source of information</text>
  <text x="147" y="275" text-anchor="middle" class="s">产生待传递的消息</text>

  <rect x="315" y="150" width="205" height="155" class="core"/>
  <text x="417" y="199" text-anchor="middle" class="h">发送设备</text>
  <text x="417" y="232" text-anchor="middle" class="t">Transmitter</text>
  <text x="417" y="264" text-anchor="middle" class="s">编码、调制</text>
  <text x="417" y="290" text-anchor="middle" class="s">把消息变成发送信号</text>

  <rect x="615" y="155" width="195" height="145" class="core"/>
  <text x="712" y="205" text-anchor="middle" class="h">信道</text>
  <text x="712" y="238" text-anchor="middle" class="t">Channel</text>
  <text x="712" y="272" text-anchor="middle" class="s">电缆、光纤、自由空间</text>

  <rect x="895" y="150" width="205" height="155" class="core"/>
  <text x="997" y="199" text-anchor="middle" class="h">接收设备</text>
  <text x="997" y="232" text-anchor="middle" class="t">Receiver</text>
  <text x="997" y="264" text-anchor="middle" class="s">解调、译码</text>
  <text x="997" y="290" text-anchor="middle" class="s">从接收信号恢复消息</text>

  <rect x="965" y="440" width="185" height="115" class="box"/>
  <text x="1057" y="485" text-anchor="middle" class="h">信息用户</text>
  <text x="1057" y="518" text-anchor="middle" class="t">User of information</text>

  <rect x="620" y="455" width="185" height="90" class="noise"/>
  <text x="712" y="495" text-anchor="middle" class="h">噪声</text>
  <text x="712" y="525" text-anchor="middle" class="t">Noise</text>

  <path d="M240 227H310" class="arrow"/>
  <path d="M520 227H610" class="arrow"/>
  <path d="M810 227H890" class="arrow"/>
  <path d="M997 305V435" class="arrow"/>
  <path d="M712 455V305" class="noise-arrow"/>

  <path d="M240 227V380H355" stroke="#6c7f91" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
  <path d="M835 380H970V435" stroke="#6c7f91" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
  <text x="282" y="365" class="s">消息 message</text>
  <text x="860" y="365" class="s">恢复的消息 message</text>
  <text x="345" y="337" class="s">信息 information</text>
  <text x="795" y="337" class="s">信息 information</text>
  <text x="555" y="337" class="s">在信道中传播的是信号 signal</text>
  <path d="M548 320H842" stroke="#6c7f91" stroke-width="2" marker-end="url(#a)"/>
</svg>
