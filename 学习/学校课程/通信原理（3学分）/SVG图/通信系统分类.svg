<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="820" viewBox="0 0 1250 820" role="img" aria-labelledby="title desc">
  <title id="title">通信系统分类</title>
  <desc id="desc">通信系统可以按信号特性、传输介质、复用方式、通信双方和传输同步方式分类。</desc>
  <defs>
    <style>
      .title { font: 700 36px "Microsoft YaHei", sans-serif; fill: #203247; }
      .root { font: 700 26px Arial, sans-serif; fill: #ffffff; }
      .h { font: 700 22px "Microsoft YaHei", sans-serif; fill: #17324d; }
      .t { font: 18px "Microsoft YaHei", sans-serif; fill: #334e68; }
      .line { stroke: #7b8fa3; stroke-width: 3; fill: none; }
      .blue { fill: #dceeff; stroke: #2d74b5; stroke-width: 2; rx: 8; }
      .green { fill: #e3f5eb; stroke: #2f855a; stroke-width: 2; rx: 8; }
      .orange { fill: #fff1dc; stroke: #c56a16; stroke-width: 2; rx: 8; }
      .purple { fill: #efe7fa; stroke: #7553a6; stroke-width: 2; rx: 8; }
    </style>
  </defs>
  <rect width="1250" height="820" fill="#ffffff"/>
  <text x="65" y="58" class="title">通信系统分类：同一个系统可以从多个角度描述</text>
  <rect x="455" y="95" width="340" height="78" fill="#1864ab" rx="10"/>
  <text x="625" y="144" text-anchor="middle" class="root">Communication System</text>
  <path d="M625 173V220M150 220H1090M150 220V270M385 220V270M625 220V270M865 220V270M1090 220V270" class="line"/>

  <rect x="45" y="270" width="210" height="62" class="blue"/><text x="150" y="309" text-anchor="middle" class="h">按信号特性</text>
  <rect x="280" y="270" width="210" height="62" class="green"/><text x="385" y="309" text-anchor="middle" class="h">按传输介质</text>
  <rect x="520" y="270" width="210" height="62" class="orange"/><text x="625" y="309" text-anchor="middle" class="h">按复用方式</text>
  <rect x="760" y="270" width="210" height="62" class="purple"/><text x="865" y="309" text-anchor="middle" class="h">按通信双方</text>
  <rect x="985" y="270" width="210" height="62" class="blue"/><text x="1090" y="309" text-anchor="middle" class="h">按传输与同步</text>

  <path d="M150 332V365M385 332V365M625 332V365M865 332V365M1090 332V365" class="line"/>
  <rect x="45" y="365" width="210" height="52" class="blue"/><text x="150" y="399" text-anchor="middle" class="t">模拟通信</text>
  <rect x="45" y="430" width="210" height="52" class="blue"/><text x="150" y="464" text-anchor="middle" class="t">数字通信</text>

  <rect x="280" y="365" width="210" height="52" class="green"/><text x="385" y="399" text-anchor="middle" class="t">有线通信</text>
  <rect x="280" y="430" width="210" height="52" class="green"/><text x="385" y="464" text-anchor="middle" class="t">无线通信</text>

  <rect x="520" y="365" width="210" height="52" class="orange"/><text x="625" y="399" text-anchor="middle" class="t">FDM 频分复用</text>
  <rect x="520" y="430" width="210" height="52" class="orange"/><text x="625" y="464" text-anchor="middle" class="t">TDM 时分复用</text>
  <rect x="520" y="495" width="210" height="52" class="orange"/><text x="625" y="529" text-anchor="middle" class="t">CDM 码分复用</text>

  <rect x="760" y="365" width="210" height="52" class="purple"/><text x="865" y="399" text-anchor="middle" class="t">点对点 / 广播</text>
  <rect x="760" y="430" width="210" height="52" class="purple"/><text x="865" y="464" text-anchor="middle" class="t">单工</text>
  <rect x="760" y="495" width="210" height="52" class="purple"/><text x="865" y="529" text-anchor="middle" class="t">半双工</text>
  <rect x="760" y="560" width="210" height="52" class="purple"/><text x="865" y="594" text-anchor="middle" class="t">全双工</text>

  <rect x="985" y="365" width="210" height="52" class="blue"/><text x="1090" y="399" text-anchor="middle" class="t">串行 / 并行</text>
  <rect x="985" y="430" width="210" height="52" class="blue"/><text x="1090" y="464" text-anchor="middle" class="t">同步</text>
  <rect x="985" y="495" width="210" height="52" class="blue"/><text x="1090" y="529" text-anchor="middle" class="t">异步</text>

  <rect x="155" y="675" width="940" height="85" fill="#f4f7fa" stroke="#9fb2c2" stroke-width="2" rx="8"/>
  <text x="625" y="713" text-anchor="middle" class="h">分类不是互斥标签：同一个 5G 系统可以同时是数字、无线、双向和复用系统</text>
  <text x="625" y="744" text-anchor="middle" class="t">判断前先明确“分类依据是什么”</text>
</svg>
