<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="820" viewBox="0 0 1250 820" role="img" aria-labelledby="title desc">
  <title id="title">通信系统分类</title>
  <desc id="desc">通信系统可以按信号特性、传输介质、复用方式、通信方向、数据传输方式和同步方式进行分类。</desc>
  <defs>
    <style>
      .title { font: 700 36px "Microsoft YaHei", sans-serif; fill: #203247; }
      .root { font: 700 28px "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .h { font: 700 22px "Microsoft YaHei", sans-serif; fill: #17324d; }
      .t { font: 18px "Microsoft YaHei", sans-serif; fill: #334e68; }
      .line { stroke: #7b8fa3; stroke-width: 3; fill: none; }
      .blue { fill: #dceeff; stroke: #2d74b5; stroke-width: 2; rx: 8; }
      .green { fill: #e3f5eb; stroke: #2f855a; stroke-width: 2; rx: 8; }
      .orange { fill: #fff1dc; stroke: #c56a16; stroke-width: 2; rx: 8; }
      .purple { fill: #efe7fa; stroke: #7553a6; stroke-width: 2; rx: 8; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#7b8fa3"/></marker>
  </defs>
  <rect width="1250" height="820" fill="#ffffff"/>
  <text x="65" y="58" class="title">通信系统分类：同一个系统可以从多个角度描述</text>
  <rect x="470" y="95" width="310" height="78" fill="#1864ab" rx="10"/>
  <text x="625" y="145" text-anchor="middle" class="root">Communication System</text>

  <path d="M625 173V220M160 220H1090M160 220V270M385 220V270M625 220V270M865 220V270M1090 220V270" class="line"/>
  <rect x="45" y="270" width="230" height="68" class="blue"/><text x="160" y="313" text-anchor="middle" class="h">按信号特性</text>
  <rect x="270" y="270" width="230" height="68" class="green"/><text x="385" y="313" text-anchor="middle" class="h">按传输介质</text>
  <rect x="510" y="270" width="230" height="68" class="orange"/><text x="625" y="313" text-anchor="middle" class="h">按复用方式</text>
  <rect x="750" y="270" width="230" height="68" class="purple"/><text x="865" y="313" text-anchor="middle" class="h">按通信双方</text>
  <rect x="975" y="270" width="230" height="68" class="blue"/><text x="1090" y="313" text-anchor="middle" class="h">按传输与同步</text>

  <path d="M160 338V385M65 385H255M65 385V430M255 385V430" class="line"/>
  <rect x="15" y="430" width="235" height="58" class="blue"/><text x="132" y="467" text-anchor="middle" class="t">模拟通信系统</text>
  <rect x="15" y="510" width="235" height="58" class="blue"/><text x="132" y="547" text-anchor="middle" class="t">数字通信系统</text>

  <path d="M385 338V385M315 385H455M315 385V430M455 385V430" class="line"/>
  <rect x="255" y="430" width="235" height="58" class="green"/><text x="372" y="467" text-anchor="middle" class="t">有线通信 Wired</text>
  <rect x="255" y="510" width="235" height="58" class="green"/><text x="372" y="547" text-anchor="middle" class="t">无线通信 Wireless</text>

  <path d="M625 338V385M515 385H735M515 385V430M625 385V475M735 385V430" class="line"/>
  <rect x="485" y="430" width="125" height="58" class="orange"/><text x="547" y="467" text-anchor="middle" class="t">FDM</text>
  <rect x="485" y="510" width="125" height="58" class="orange"/><text x="547" y="547" text-anchor="middle" class="t">TDM</text>
  <rect x="645" y="475" width="125" height="58" class="orange"/><text x="707" y="512" text-anchor="middle" class="t">CDM</text>

  <path d="M865 338V385M765 385H965M765 385V430M865 385V475M965 385V430" class="line"/>
  <rect x="715" y="430" width="145" height="58" class="purple"/><text x="787" y="467" text-anchor="middle" class="t">点对点</text>
  <rect x="715" y="510" width="145" height="58" class="purple"/><text x="787" y="547" text-anchor="middle" class="t">广播</text>
  <rect x="865" y="475" width="145" height="58" class="purple"/><text x="937" y="512" text-anchor="middle" class="t">单工</text>
  <rect x="865" y="555" width="145" height="58" class="purple"/><text x="937" y="592" text-anchor="middle" class="t">半双工</text>
  <rect x="865" y="635" width="145" height="58" class="purple"/><text x="937" y="672" text-anchor="middle" class="t">全双工</text>

  <path d="M1090 338V385M985 385H1195M985 385V430M1090 385V475M1195 385V430" class="line"/>
  <rect x="935" y="430" width="145" height="58" class="blue"/><text x="1007" y="467" text-anchor="middle" class="t">串行</text>
  <rect x="935" y="510" width="145" height="58" class="blue"/><text x="1007" y="547" text-anchor="middle" class="t">并行</text>
  <rect x="1125" y="430" width="115" height="58" class="blue"/><text x="1182" y="467" text-anchor="middle" class="t">同步</text>
  <rect x="1125" y="510" width="115" height="58" class="blue"/><text x="1182" y="547" text-anchor="middle" class="t">异步</text>

  <rect x="205" y="705" width="840" height="65" fill="#f4f7fa" stroke="#9fb2c2" stroke-width="2" rx="8"/>
  <text x="625" y="735" text-anchor="middle" class="h">分类不是互斥标签：同一个 5G 系统可以同时是数字、无线、双向、复用系统</text>
  <text x="625" y="759" text-anchor="middle" class="t">判断前先明确“分类依据是什么”</text>
</svg>
