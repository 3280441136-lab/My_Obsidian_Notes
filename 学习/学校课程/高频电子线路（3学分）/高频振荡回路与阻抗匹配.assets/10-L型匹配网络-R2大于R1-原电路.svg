<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#f7f9fc"/>
  <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.n{font-size:18px}.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:22px;fill:#172033}.w{stroke:#172033;stroke-width:4;fill:none}.a{stroke:#1769aa;stroke-width:4;fill:none}.r{stroke:#c75516;stroke-width:4;fill:none}.node{fill:#172033}.box{fill:#ffffff;stroke:#b9c5d6;stroke-width:2}</style>
  <text x="600" y="42" text-anchor="middle" class="t h">L 型匹配网络（R₂ > R₁）：原电路</text>
  <text x="600" y="78" text-anchor="middle" class="t s">高阻端 R₂ 并联 C，低阻端 R₁ 串联 L</text>

  <g transform="translate(50 115)">
    <rect x="0" y="0" width="435" height="370" rx="18" class="box"/>
    <text x="218" y="38" text-anchor="middle" class="t s">前级与低阻端</text>
    <line x1="35" y1="115" x2="400" y2="115" class="w"/>
    <line x1="35" y1="325" x2="400" y2="325" class="w"/>

    <circle cx="100" cy="220" r="43" class="a"/>
    <line x1="100" y1="196" x2="100" y2="244" class="a"/>
    <path d="M91 235 L100 244 L109 235" class="a"/>
    <line x1="100" y1="115" x2="100" y2="177" class="w"/>
    <line x1="100" y1="263" x2="100" y2="325" class="w"/>
    <text x="100" y="292" text-anchor="middle" class="t n">i_s</text>

    <line x1="205" y1="115" x2="205" y2="150" class="w"/>
    <path d="M205 150 l-18 12 l36 20 l-36 20 l36 20 l-36 20 l18 12" class="r"/>
    <line x1="205" y1="234" x2="205" y2="325" class="w"/>
    <text x="238" y="205" class="t n">R₁</text>

    <line x1="205" y1="115" x2="278" y2="115" class="w"/>
    <path d="M278 115 c0 -28 42 -28 42 0 c0 28 42 28 42 0 c0 -28 42 -28 42 0 c0 28 42 28 42 0" class="a"/>
    <line x1="404" y1="115" x2="404" y2="115" class="w"/>
    <text x="338" y="82" text-anchor="middle" class="t n">L</text>
    <text x="218" y="358" text-anchor="middle" class="t n">1 部分：端口 R₁ + 串联 L</text>
  </g>

  <path d="M515 300 H590" class="a"/><path d="M570 282 L590 300 L570 318" class="a"/>

  <g transform="translate(625 115)">
    <rect x="0" y="0" width="525" height="370" rx="18" class="box"/>
    <text x="262" y="38" text-anchor="middle" class="t s">2 部分：R₂ ∥ C</text>
    <line x1="35" y1="115" x2="490" y2="115" class="w"/>
    <line x1="35" y1="325" x2="490" y2="325" class="w"/>

    <line x1="175" y1="115" x2="175" y2="155" class="w"/>
    <line x1="140" y1="155" x2="210" y2="155" class="a"/>
    <line x1="140" y1="180" x2="210" y2="180" class="a"/>
    <line x1="175" y1="180" x2="175" y2="325" class="w"/>
    <text x="175" y="365" text-anchor="middle" class="t n">C</text>

    <line x1="355" y1="115" x2="355" y2="150" class="w"/>
    <path d="M355 150 l-18 12 l36 20 l-36 20 l36 20 l-36 20 l18 12" class="r"/>
    <line x1="355" y1="234" x2="355" y2="325" class="w"/>
    <text x="395" y="205" class="t n">R₂</text>

    <text x="262" y="358" text-anchor="middle" class="t n">高阻负载并联 C，先把 R₂ 向下变换</text>
  </g>

  <rect x="195" y="525" width="810" height="48" rx="12" fill="#fff4df" stroke="#e1a34a"/>
  <text x="600" y="557" text-anchor="middle" class="t eq">Q = ω₀CR₂ = ω₀L/R₁，  R₁ = R₂/(1 + Q²)</text>
</svg>
