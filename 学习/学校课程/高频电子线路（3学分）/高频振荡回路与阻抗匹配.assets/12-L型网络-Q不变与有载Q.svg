<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f7f9fc"/>
  <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.n{font-size:18px}.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:22px;fill:#172033}.w{stroke:#172033;stroke-width:4;fill:none}.a{stroke:#1769aa;stroke-width:4;fill:none}.r{stroke:#c75516;stroke-width:4;fill:none}.box{fill:#ffffff;stroke:#b9c5d6;stroke-width:2}</style>
  <text x="600" y="42" text-anchor="middle" class="t h">为什么三个 Q 是同一个 Q</text>
  <text x="600" y="78" text-anchor="middle" class="t s">串并等效保持 Q 不变；谐振时电感、电容交换的无功功率大小相等</text>

  <g transform="translate(60 125)">
    <rect x="0" y="0" width="330" height="265" rx="18" class="box"/>
    <text x="165" y="38" text-anchor="middle" class="t s">串联视图</text>
    <line x1="45" y1="135" x2="285" y2="135" class="w"/>
    <path d="M75 135 l12 -18 l20 36 l20 -36 l20 36 l20 -36 l12 18" class="r"/>
    <path d="M175 135 c0 -25 38 -25 38 0 c0 25 38 25 38 0 c0 -25 38 -25 38 0" class="a"/>
    <text x="115" y="98" text-anchor="middle" class="t n">Rₛ</text>
    <text x="228" y="98" text-anchor="middle" class="t n">jXₛ</text>
    <text x="165" y="205" text-anchor="middle" class="t eq">Q = |Xₛ|/Rₛ</text>
    <text x="165" y="242" text-anchor="middle" class="t n">无功功率 / 有功功率</text>
  </g>

  <path d="M420 258 H525" class="a"/><path d="M505 240 L525 258 L505 276" class="a"/>
  <text x="473" y="222" text-anchor="middle" class="t s">同一 ω₀</text>
  <text x="473" y="310" text-anchor="middle" class="t eq">Q 不变</text>

  <g transform="translate(555 125)">
    <rect x="0" y="0" width="330" height="265" rx="18" class="box"/>
    <text x="165" y="38" text-anchor="middle" class="t s">并联视图</text>
    <line x1="45" y1="85" x2="285" y2="85" class="w"/>
    <line x1="45" y1="205" x2="285" y2="205" class="w"/>
    <line x1="115" y1="85" x2="115" y2="115" class="w"/>
    <path d="M115 115 l-18 12 l36 20 l-36 20 l36 20 l18 12" class="r"/>
    <line x1="115" y1="179" x2="115" y2="205" class="w"/>
    <line x1="215" y1="85" x2="215" y2="115" class="w"/>
    <path d="M215 115 c-28 0 -28 30 0 30 c28 0 28 30 0 30" class="a"/>
    <line x1="215" y1="175" x2="215" y2="205" class="w"/>
    <text x="78" y="155" text-anchor="middle" class="t n">Rₚ</text>
    <text x="252" y="155" text-anchor="middle" class="t n">jXₚ</text>
    <text x="165" y="245" text-anchor="middle" class="t eq">Q = Rₚ/|Xₚ|</text>
  </g>

  <g transform="translate(925 125)">
    <rect x="0" y="0" width="225" height="265" rx="18" class="box"/>
    <text x="112" y="38" text-anchor="middle" class="t s">谐振时</text>
    <text x="112" y="92" text-anchor="middle" class="t eq">Q<tspan baseline-shift="sub" font-size="0.72em">L</tspan> = ω<tspan baseline-shift="sub" font-size="0.72em">0</tspan>W/P</text>
    <text x="112" y="137" text-anchor="middle" class="t n">W：交换的储能</text>
    <text x="112" y="171" text-anchor="middle" class="t n">P：消耗的有功功率</text>
    <text x="112" y="222" text-anchor="middle" class="t eq">Q₁ = Q₂ = Q<tspan baseline-shift="sub" font-size="0.72em">L</tspan></text>
  </g>

  <rect x="155" y="440" width="890" height="65" rx="14" fill="#fff4df" stroke="#e1a34a"/>
  <text x="600" y="470" text-anchor="middle" class="t n">局部 Q 只需要局部的 R、X；相等则来自无损、同一频率、谐振与匹配四个条件。</text>
  <text x="600" y="500" text-anchor="middle" class="t n">任意拆开复杂电路，其局部 Q 未必等于整体 Q。</text>
</svg>



