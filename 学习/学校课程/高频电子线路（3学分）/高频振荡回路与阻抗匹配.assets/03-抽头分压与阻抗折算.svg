<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f7f9fc"/>
  <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.n{font-size:18px}.w{stroke:#172033;stroke-width:4;fill:none}.a{stroke:#1769aa;stroke-width:4;fill:none}.o{stroke:#c75516;stroke-width:4;fill:none}.node{fill:#172033}</style>
  <text x="600" y="43" text-anchor="middle" class="t h">抽头回路：先求电压比，再按平方折算阻抗</text>
  <g transform="translate(50 95)">
    <text x="245" y="0" text-anchor="middle" class="t s">电感抽头</text>
    <line x1="80" y1="40" x2="80" y2="90" class="w"/><path d="M80 90 c-34 0 -34 34 0 34 c34 0 34 34 0 34 c-34 0 -34 34 0 34 c34 0 34 34 0 34 c-34 0 -34 34 0 34 c34 0 34 34 0 34" class="a"/><line x1="80" y1="294" x2="80" y2="350" class="w"/>
    <circle cx="80" cy="192" r="6" class="node"/><line x1="80" y1="192" x2="225" y2="192" class="w"/><line x1="80" y1="40" x2="360" y2="40" class="w"/><line x1="80" y1="350" x2="360" y2="350" class="w"/>
    <line x1="360" y1="40" x2="360" y2="80" class="w"/><polyline points="360,80 342,98 378,116 342,134 378,152 342,170 378,188 360,206" class="o"/><line x1="360" y1="206" x2="360" y2="350" class="w"/>
    <text x="104" y="138" class="t n">L₁</text><text x="104" y="260" class="t n">L₂</text><text x="245" y="183" class="t n">抽头电压 Uₜ</text><text x="389" y="151" class="t n">R</text>
    <text x="245" y="405" text-anchor="middle" class="t n">p = Uₜ/U = L₂/(L₁+L₂)</text><text x="245" y="438" text-anchor="middle" class="t n">真实紧耦合线圈优先用 p = Nₜ/N</text>
  </g>
  <g transform="translate(650 95)">
    <text x="245" y="0" text-anchor="middle" class="t s">电容抽头</text>
    <line x1="105" y1="40" x2="330" y2="40" class="w"/><line x1="105" y1="350" x2="330" y2="350" class="w"/>
    <line x1="170" y1="40" x2="170" y2="100" class="w"/><line x1="138" y1="100" x2="202" y2="100" class="a"/><line x1="138" y1="126" x2="202" y2="126" class="a"/><line x1="170" y1="126" x2="170" y2="210" class="w"/><circle cx="170" cy="210" r="6" class="node"/><line x1="170" y1="210" x2="330" y2="210" class="w"/><line x1="170" y1="210" x2="170" y2="270" class="w"/><line x1="138" y1="270" x2="202" y2="270" class="a"/><line x1="138" y1="296" x2="202" y2="296" class="a"/><line x1="170" y1="296" x2="170" y2="350" class="w"/>
    <line x1="330" y1="210" x2="330" y2="238" class="w"/><polyline points="330,238 312,254 348,270 312,286 348,302 312,318 330,334" class="o"/><line x1="330" y1="334" x2="330" y2="350" class="w"/>
    <text x="215" y="119" class="t n">C₁</text><text x="215" y="289" class="t n">C₂</text><text x="355" y="290" class="t n">R</text>
    <text x="245" y="405" text-anchor="middle" class="t n">p = Uₜ/U = C₁/(C₁+C₂)</text><text x="245" y="438" text-anchor="middle" class="t n">多电容时按 ZC = 1/(jωC) 做阻抗分压</text>
  </g>
  <rect x="225" y="555" width="750" height="45" rx="4" fill="#e8f1f8" stroke="#1769aa" stroke-width="2"/>
  <text x="600" y="585" text-anchor="middle" class="t s">统一规则：Uₜ = pU；从抽头看 Zₜ = p²Z；从抽头负载折算到完整回路 Z′ = Z/p²</text>
</svg>
