<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f7f9fc"/>
  <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:29px;font-weight:700}.s{font-size:21px}.n{font-size:18px}.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:21px;fill:#172033}.w{stroke:#172033;stroke-width:4;fill:none}.a{stroke:#1769aa;stroke-width:4;fill:none}.r{stroke:#c75516;stroke-width:4;fill:none}.box{fill:#ffffff;stroke:#b9c5d6;stroke-width:2}</style>
  <text x="600" y="42" text-anchor="middle" class="t h">例3（一）：10 Ω 纯阻负载变换为 50 Ω</text>
  <text x="600" y="78" text-anchor="middle" class="t s">设计频率 f₀ = 20 MHz；高阻端并联 C，低阻端串联 L</text>

  <g transform="translate(65 125)">
    <rect x="0" y="0" width="1070" height="300" rx="18" class="box"/>
    <line x1="55" y1="85" x2="1015" y2="85" class="w"/>
    <line x1="55" y1="245" x2="1015" y2="245" class="w"/>

    <circle cx="85" cy="85" r="8" fill="#172033"/>
    <circle cx="85" cy="245" r="8" fill="#172033"/>
    <path d="M115 165 H185" class="a"/><path d="M168 151 L185 165 L168 179" class="a"/>
    <text x="150" y="132" text-anchor="middle" class="t eq">Z<tspan baseline-shift="sub" font-size="0.72em">in</tspan> = 50 Ω</text>

    <line x1="300" y1="85" x2="300" y2="130" class="w"/>
    <line x1="265" y1="130" x2="335" y2="130" class="a"/>
    <line x1="265" y1="155" x2="335" y2="155" class="a"/>
    <line x1="300" y1="155" x2="300" y2="245" class="w"/>
    <text x="300" y="285" text-anchor="middle" class="t eq">C = 318 pF</text>

    <line x1="300" y1="85" x2="525" y2="85" class="w"/>
    <path d="M525 85 c0 -27 42 -27 42 0 c0 27 42 27 42 0 c0 -27 42 -27 42 0 c0 27 42 27 42 0" class="a"/>
    <line x1="693" y1="85" x2="875" y2="85" class="w"/>
    <text x="609" y="50" text-anchor="middle" class="t eq">L = 0.16 µH</text>

    <line x1="875" y1="85" x2="875" y2="125" class="w"/>
    <path d="M875 125 l-18 12 l36 20 l-36 20 l36 20 l-36 20 l18 12" class="r"/>
    <line x1="875" y1="209" x2="875" y2="245" class="w"/>
    <text x="915" y="178" class="t eq">R<tspan baseline-shift="sub" font-size="0.72em">L</tspan> = 10 Ω</text>
  </g>

  <rect x="135" y="470" width="930" height="52" rx="12" fill="#fff4df" stroke="#e1a34a"/>
  <text x="600" y="503" text-anchor="middle" class="t eq">Q = 2，X<tspan baseline-shift="sub" font-size="0.72em">L</tspan> = ω<tspan baseline-shift="sub" font-size="0.72em">0</tspan>L = 20 Ω，X<tspan baseline-shift="sub" font-size="0.72em">C</tspan> = 1/(ω<tspan baseline-shift="sub" font-size="0.72em">0</tspan>C) = 25 Ω</text>
</svg>
