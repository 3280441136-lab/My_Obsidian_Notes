<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#f7f9fc"/>
  <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.n{font-size:18px}.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:22px;fill:#172033}.w{stroke:#172033;stroke-width:4;fill:none}.a{stroke:#1769aa;stroke-width:4;fill:none}.r{stroke:#c75516;stroke-width:4;fill:none}.g{stroke:#2f7d4a;stroke-width:3;fill:none;stroke-dasharray:10 8}.node{fill:#172033}.box{fill:#ffffff;stroke:#b9c5d6;stroke-width:2}</style>
  <text x="600" y="42" text-anchor="middle" class="t h">L 型匹配网络（R₁ > R₂）：原电路</text>
  <text x="600" y="78" text-anchor="middle" class="t s">高阻端并联 C，低阻端串联 L；在一个设计频率处完成匹配</text>

  <g transform="translate(55 115)">
    <rect x="0" y="0" width="505" height="370" rx="18" class="box"/>
    <text x="250" y="38" text-anchor="middle" class="t s">1 部分：前级端口 R₁ ∥ C</text>
    <line x1="45" y1="115" x2="465" y2="115" class="w"/>
    <line x1="45" y1="325" x2="465" y2="325" class="w"/>

    <circle cx="105" cy="220" r="43" class="a"/>
    <line x1="105" y1="196" x2="105" y2="244" class="a"/>
    <path d="M96 235 L105 244 L114 235" class="a"/>
    <line x1="105" y1="115" x2="105" y2="177" class="w"/>
    <line x1="105" y1="263" x2="105" y2="325" class="w"/>
    <text x="105" y="292" text-anchor="middle" class="t eq">i<tspan baseline-shift="sub" font-size="0.72em">s</tspan></text>

    <line x1="235" y1="115" x2="235" y2="150" class="w"/>
    <path d="M235 150 l-18 12 l36 20 l-36 20 l36 20 l-36 20 l18 12" class="r"/>
    <line x1="235" y1="234" x2="235" y2="325" class="w"/>
    <text x="235" y="282" text-anchor="middle" class="t n">R₁：前级等效电阻</text>

    <line x1="405" y1="115" x2="405" y2="177" class="w"/>
    <line x1="370" y1="177" x2="440" y2="177" class="a"/>
    <line x1="370" y1="202" x2="440" y2="202" class="a"/>
    <line x1="405" y1="202" x2="405" y2="325" class="w"/>
    <text x="455" y="196" class="t n">C</text>

    <rect x="52" y="345" width="375" height="40" rx="10" fill="#eef5ff" stroke="#8cb7e8"/>
    <text x="240" y="372" text-anchor="middle" class="t n">匹配目标：从右向左看，Z<tspan baseline-shift="sub" font-size="0.72em">in</tspan>(ω<tspan baseline-shift="sub" font-size="0.72em">0</tspan>) = R₁</text>
  </g>

  <path d="M590 300 H665" class="a"/><path d="M645 282 L665 300 L645 318" class="a"/>

  <g transform="translate(690 115)">
    <rect x="0" y="0" width="455" height="370" rx="18" class="box"/>
    <text x="228" y="38" text-anchor="middle" class="t s">2 部分：L + R₂</text>
    <line x1="40" y1="115" x2="415" y2="115" class="w"/>
    <line x1="40" y1="325" x2="415" y2="325" class="w"/>

    <line x1="75" y1="115" x2="112" y2="115" class="w"/>
    <path d="M112 115 c0 -28 42 -28 42 0 c0 28 42 28 42 0 c0 -28 42 -28 42 0 c0 28 42 28 42 0" class="a"/>
    <line x1="280" y1="115" x2="415" y2="115" class="w"/>
    <text x="195" y="82" text-anchor="middle" class="t n">L</text>

    <line x1="335" y1="115" x2="335" y2="165" class="w"/>
    <path d="M335 165 l-18 12 l36 20 l-36 20 l36 20 l-36 20 l18 12" class="r"/>
    <line x1="335" y1="249" x2="335" y2="325" class="w"/>
    <text x="374" y="218" class="t n">R₂</text>
    <text x="228" y="358" text-anchor="middle" class="t n">负载是低阻；用 L 把 R₂ 向上变换</text>
  </g>

  <rect x="205" y="525" width="790" height="48" rx="12" fill="#fff4df" stroke="#e1a34a"/>
  <text x="600" y="557" text-anchor="middle" class="t eq">Q = ω₀L/R₂ = ω₀CR₁，  R₁ = (1 + Q²)R₂</text>
</svg>



