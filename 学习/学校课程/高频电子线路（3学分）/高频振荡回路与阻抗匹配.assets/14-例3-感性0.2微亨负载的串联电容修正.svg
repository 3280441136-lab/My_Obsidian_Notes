<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#f7f9fc"/>
  <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:29px;font-weight:700}.s{font-size:21px}.n{font-size:18px}.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:21px;fill:#172033}.w{stroke:#172033;stroke-width:4;fill:none}.a{stroke:#1769aa;stroke-width:4;fill:none}.r{stroke:#c75516;stroke-width:4;fill:none}.box{fill:#ffffff;stroke:#b9c5d6;stroke-width:2}</style>
  <text x="600" y="42" text-anchor="middle" class="t h">例3（二）：10 Ω 与 0.2 µH 串联的感性负载</text>
  <text x="600" y="78" text-anchor="middle" class="t s">在 20 MHz 用串联电容把 25.13 Ω 感抗修正为 20 Ω，再复用 318 pF 输入电容</text>

  <g transform="translate(55 125)">
    <rect x="0" y="0" width="1090" height="320" rx="18" class="box"/>
    <line x1="45" y1="85" x2="1045" y2="85" class="w"/>
    <line x1="45" y1="255" x2="1045" y2="255" class="w"/>

    <circle cx="75" cy="85" r="8" fill="#172033"/>
    <circle cx="75" cy="255" r="8" fill="#172033"/>
    <path d="M105 170 H175" class="a"/><path d="M158 156 L175 170 L158 184" class="a"/>
    <text x="140" y="136" text-anchor="middle" class="t eq">Z<tspan baseline-shift="sub" font-size="0.72em">in</tspan> = 50 Ω</text>

    <line x1="285" y1="85" x2="285" y2="130" class="w"/>
    <line x1="250" y1="130" x2="320" y2="130" class="a"/>
    <line x1="250" y1="155" x2="320" y2="155" class="a"/>
    <line x1="285" y1="155" x2="285" y2="255" class="w"/>
    <text x="285" y="295" text-anchor="middle" class="t eq">C = 318 pF</text>

    <line x1="285" y1="85" x2="445" y2="85" class="w"/>
    <line x1="445" y1="85" x2="485" y2="85" class="w"/>
    <line x1="485" y1="50" x2="485" y2="120" class="a"/>
    <line x1="515" y1="50" x2="515" y2="120" class="a"/>
    <line x1="515" y1="85" x2="650" y2="85" class="w"/>
    <text x="500" y="32" text-anchor="middle" class="t eq">C<tspan baseline-shift="sub" font-size="0.72em">s</tspan> = 1560 pF</text>

    <path d="M650 85 c0 -27 42 -27 42 0 c0 27 42 27 42 0 c0 -27 42 -27 42 0 c0 27 42 27 42 0" class="a"/>
    <line x1="818" y1="85" x2="930" y2="85" class="w"/>
    <text x="734" y="50" text-anchor="middle" class="t eq">L<tspan baseline-shift="sub" font-size="0.72em">load</tspan> = 0.2 µH</text>

    <line x1="930" y1="85" x2="930" y2="125" class="w"/>
    <path d="M930 125 l-18 12 l36 20 l-36 20 l36 20 l-36 20 l18 12" class="r"/>
    <line x1="930" y1="209" x2="930" y2="255" class="w"/>
    <text x="972" y="178" class="t eq">R<tspan baseline-shift="sub" font-size="0.72em">L</tspan> = 10 Ω</text>

    <path d="M515 145 H765" stroke="#2f7d4a" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="640" y="180" text-anchor="middle" class="t n">净串联电抗：+j20 Ω</text>
  </g>

  <rect x="105" y="485" width="990" height="72" rx="12" fill="#fff4df" stroke="#e1a34a"/>
  <text x="600" y="516" text-anchor="middle" class="t eq">ω<tspan baseline-shift="sub" font-size="0.72em">0</tspan>L<tspan baseline-shift="sub" font-size="0.72em">load</tspan> = 25.13 Ω，X<tspan baseline-shift="sub" font-size="0.72em">C</tspan> = 5.13 Ω</text>
  <text x="600" y="545" text-anchor="middle" class="t eq">25.13 Ω − 5.13 Ω = 20 Ω = ω<tspan baseline-shift="sub" font-size="0.72em">0</tspan>(0.16 µH)</text>
</svg>
