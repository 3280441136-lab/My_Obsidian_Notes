<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f7f9fc"/>
  <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:21px}.n{font-size:18px}.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:20px;fill:#172033}.w{stroke:#172033;stroke-width:4;fill:none}.a{stroke:#1769aa;stroke-width:4;fill:none}.r{stroke:#c75516;stroke-width:4;fill:none}.g{stroke:#2f7d4a;stroke-width:3;fill:none;stroke-dasharray:10 8}.box{fill:#ffffff;stroke:#b9c5d6;stroke-width:2}</style>
  <text x="600" y="42" text-anchor="middle" class="t h">T 型匹配网络：低—高—低的两级 L 型变换</text>
  <text x="600" y="78" text-anchor="middle" class="t s">中间是虚拟高阻 Rₘ；两个 L 型的高阻端电容并联，合并为 C_T</text>

  <g transform="translate(45 120)">
    <rect x="0" y="0" width="530" height="390" rx="18" class="box"/>
    <text x="265" y="38" text-anchor="middle" class="t s">实际 T 型电路</text>
    <line x1="35" y1="145" x2="495" y2="145" class="w"/>
    <line x1="35" y1="315" x2="495" y2="315" class="w"/>

    <circle cx="65" cy="145" r="8" fill="#172033"/><circle cx="65" cy="315" r="8" fill="#172033"/>
    <text x="65" y="360" text-anchor="middle" class="t eq">R₁</text>

    <line x1="65" y1="145" x2="115" y2="145" class="w"/>
    <path d="M115 145 c0 -27 42 -27 42 0 c0 27 42 27 42 0 c0 -27 42 -27 42 0 c0 27 42 27 42 0" class="a"/>
    <line x1="283" y1="145" x2="360" y2="145" class="w"/>
    <text x="199" y="110" text-anchor="middle" class="t eq">L₁</text>

    <line x1="360" y1="145" x2="360" y2="185" class="w"/>
    <line x1="325" y1="185" x2="395" y2="185" class="a"/>
    <line x1="325" y1="210" x2="395" y2="210" class="a"/>
    <line x1="360" y1="210" x2="360" y2="315" class="w"/>
    <text x="360" y="355" text-anchor="middle" class="t eq">C_T = C₁ + C₂</text>

    <line x1="360" y1="145" x2="410" y2="145" class="w"/>
    <path d="M410 145 c0 -27 42 -27 42 0 c0 27 42 27 42 0" class="a"/>
    <line x1="494" y1="145" x2="495" y2="145" class="w"/>
    <text x="452" y="110" text-anchor="middle" class="t eq">L₂</text>

    <line x1="495" y1="145" x2="495" y2="185" class="w"/>
    <path d="M495 185 l-18 12 l36 20 l-36 20 l36 20 l-36 20 l18 12" class="r"/>
    <line x1="495" y1="269" x2="495" y2="315" class="w"/>
    <text x="535" y="235" class="t eq">R₂</text>
    <text x="265" y="385" text-anchor="middle" class="t n">串联—并联—串联，外形像字母 T</text>
  </g>

  <path d="M610 315 H705" class="a"/><path d="M685 297 L705 315 L685 333" class="a"/>

  <g transform="translate(745 120)">
    <rect x="0" y="0" width="410" height="390" rx="18" class="box"/>
    <text x="205" y="38" text-anchor="middle" class="t s">拆成两个 L 型</text>
    <line x1="35" y1="135" x2="375" y2="135" class="w"/>
    <line x1="35" y1="315" x2="375" y2="315" class="w"/>

    <line x1="35" y1="135" x2="75" y2="135" class="w"/>
    <path d="M75 135 c0 -25 38 -25 38 0 c0 25 38 25 38 0" class="a"/>
    <line x1="151" y1="135" x2="205" y2="135" class="w"/>
    <line x1="205" y1="135" x2="205" y2="175" class="w"/>
    <line x1="180" y1="175" x2="230" y2="175" class="a"/>
    <line x1="180" y1="200" x2="230" y2="200" class="a"/>
    <line x1="205" y1="200" x2="205" y2="315" class="w"/>
    <text x="112" y="102" text-anchor="middle" class="t eq">L₁</text>
    <text x="205" y="255" text-anchor="middle" class="t eq">C₁</text>

    <line x1="205" y1="135" x2="255" y2="135" class="w"/>
    <path d="M255 135 c0 -25 38 -25 38 0 c0 25 38 25 38 0" class="a"/>
    <line x1="331" y1="135" x2="375" y2="135" class="w"/>
    <line x1="205" y1="135" x2="205" y2="175" class="w"/>
    <line x1="180" y1="175" x2="230" y2="175" class="a"/>
    <line x1="180" y1="200" x2="230" y2="200" class="a"/>
    <line x1="205" y1="200" x2="205" y2="315" class="w"/>
    <text x="293" y="102" text-anchor="middle" class="t eq">L₂</text>
    <text x="205" y="285" text-anchor="middle" class="t eq">C₂</text>

    <line x1="205" y1="78" x2="205" y2="335" class="g"/>
    <text x="205" y="65" text-anchor="middle" class="t eq">Rₘ：虚拟高阻</text>
    <text x="205" y="375" text-anchor="middle" class="t eq">C₁、C₂ 在同一节点并联</text>
  </g>

  <rect x="125" y="545" width="950" height="50" rx="12" fill="#fff4df" stroke="#e1a34a"/>
  <text x="600" y="578" text-anchor="middle" class="t eq">R₁ → Rₘ → R₂；Q₁ = √(Rₘ/R₁ − 1)，Q₂ = √(Rₘ/R₂ − 1)</text>
</svg>
