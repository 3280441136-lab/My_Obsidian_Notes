<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f7f9fc"/>
  <style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:21px}.n{font-size:18px}.eq{font-family:"Cambria Math","Times New Roman",serif;font-size:20px;fill:#172033}.w{stroke:#172033;stroke-width:4;fill:none}.a{stroke:#1769aa;stroke-width:4;fill:none}.r{stroke:#c75516;stroke-width:4;fill:none}.g{stroke:#2f7d4a;stroke-width:3;fill:none;stroke-dasharray:10 8}.box{fill:#ffffff;stroke:#b9c5d6;stroke-width:2}</style>
  <text x="600" y="42" text-anchor="middle" class="t h">T 型与 π 型的设计自由度</text>
  <text x="600" y="78" text-anchor="middle" class="t s">多一个电抗元件，就多了一个可选择的虚拟中间电阻 Rₘ</text>

  <g transform="translate(70 135)">
    <rect x="0" y="0" width="500" height="300" rx="18" class="box"/>
    <text x="250" y="38" text-anchor="middle" class="t s">L 型：端点直接决定 Q</text>
    <text x="250" y="115" text-anchor="middle" class="t eq">R<tspan baseline-shift="sub" font-size="0.72em">low</tspan> → R<tspan baseline-shift="sub" font-size="0.72em">high</tspan></text>
    <line x1="135" y1="155" x2="365" y2="155" class="w"/>
    <circle cx="135" cy="155" r="9" fill="#172033"/><circle cx="365" cy="155" r="9" fill="#172033"/>
    <text x="135" y="205" text-anchor="middle" class="t eq">R<tspan baseline-shift="sub" font-size="0.72em">low</tspan></text>
    <text x="365" y="205" text-anchor="middle" class="t eq">R<tspan baseline-shift="sub" font-size="0.72em">high</tspan></text>
    <text x="250" y="260" text-anchor="middle" class="t eq">Q = √(R<tspan baseline-shift="sub" font-size="0.72em">high</tspan>/R<tspan baseline-shift="sub" font-size="0.72em">low</tspan> − 1)</text>
    <text x="250" y="288" text-anchor="middle" class="t n">没有独立调节带宽的中间量</text>
  </g>

  <path d="M605 285 H675" class="a"/><path d="M655 267 L675 285 L655 303" class="a"/>

  <g transform="translate(715 135)">
    <rect x="0" y="0" width="415" height="300" rx="18" class="box"/>
    <text x="208" y="38" text-anchor="middle" class="t s">T 型 / π 型：加入 Rₘ</text>
    <text x="208" y="112" text-anchor="middle" class="t eq">R₁ → Rₘ → R₂</text>
    <line x1="65" y1="155" x2="350" y2="155" class="g"/>
    <circle cx="65" cy="155" r="9" fill="#172033"/><circle cx="208" cy="155" r="10" fill="#2f7d4a"/><circle cx="350" cy="155" r="9" fill="#172033"/>
    <text x="65" y="205" text-anchor="middle" class="t eq">R₁</text>
    <text x="208" y="205" text-anchor="middle" class="t eq">Rₘ</text>
    <text x="350" y="205" text-anchor="middle" class="t eq">R₂</text>
    <text x="208" y="258" text-anchor="middle" class="t n">T：Rₘ 高于两端；π：Rₘ 低于两端</text>
    <text x="208" y="288" text-anchor="middle" class="t n">Rₘ 选择决定两级 Q、带宽和元件值</text>
  </g>

  <rect x="125" y="480" width="950" height="48" rx="12" fill="#fff4df" stroke="#e1a34a"/>
  <text x="600" y="511" text-anchor="middle" class="t eq">T：C<tspan baseline-shift="sub" font-size="0.72em">T</tspan> = C₁ + C₂；π：L<tspan baseline-shift="sub" font-size="0.72em">π</tspan> = L₁ + L₂</text>
</svg>

