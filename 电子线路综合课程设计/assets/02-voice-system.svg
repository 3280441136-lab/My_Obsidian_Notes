  <rect x="45" y="235" width="175" height="100" rx="16" class="box"/>
  <text x="132" y="275" text-anchor="middle" class="txt">语音信号</text>
  <text x="132" y="308" text-anchor="middle" class="small">正弦波模拟输入</text>
  <rect x="295" y="235" width="210" height="100" rx="16" class="green"/>
  <text x="400" y="275" text-anchor="middle" class="txt">前置放大</text>
