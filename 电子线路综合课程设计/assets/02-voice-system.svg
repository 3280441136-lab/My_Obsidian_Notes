  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.txt{font:600 20px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.small{font:500 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow2)}</style>
  </defs>
  <rect x="0" y="0" width="1400" height="560" fill="#fff"/>
  <text x="50" y="55" class="title">任务二：语音信号放大电路——系统框图</text>
