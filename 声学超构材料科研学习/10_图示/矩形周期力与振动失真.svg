    <text x="20" y="31" class="t">设计思路：f₀ &gt; 7f 把主要谐波放在固有频率以下；Qₘ ≈ 1 压平靠近 f₀ 的过渡区。</text>
    <text x="20" y="62" class="t">注意：力谐波幅值含 1/n；换成位移还要除以 nω，所以一般项显式出现 1/n²。</text>
