<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">声学学习项目的研究路径</title>
  <desc id="desc">数学物理方法和声学基础共同支撑线性声学理解，进一步连接到声学超构材料、非线性研究及消费音频和医学超声应用。</desc>
  <style>
    .title { font: 600 30px 'Microsoft YaHei', sans-serif; fill: #1f2937; }
    .label { font: 600 22px 'Microsoft YaHei', sans-serif; fill: #172033; }
    .text { font: 17px 'Microsoft YaHei', sans-serif; fill: #334155; }
    .small { font: 15px 'Microsoft YaHei', sans-serif; fill: #475569; }
    .box { stroke-width: 2; rx: 12; ry: 12; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    .link { fill: none; stroke: #94a3b8; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="600" y="55" text-anchor="middle" class="title">从声学基础走向声学超构材料</text>

  <rect x="90" y="130" width="300" height="150" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="240" y="178" text-anchor="middle" class="label">数学物理方法</text>
  <text x="240" y="215" text-anchor="middle" class="text">复数与相位 · 微分方程</text>
  <text x="240" y="243" text-anchor="middle" class="text">傅里叶 · 按需复变函数</text>

  <rect x="810" y="130" width="300" height="150" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="960" y="178" text-anchor="middle" class="label">声学基础</text>
  <text x="960" y="215" text-anchor="middle" class="text">振动 · 声波 · 边界</text>
  <text x="960" y="243" text-anchor="middle" class="text">阻抗 · 干涉 · 共振</text>

  <rect x="400" y="330" width="400" height="130" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="600" y="380" text-anchor="middle" class="label">线性声学模型</text>
  <text x="600" y="416" text-anchor="middle" class="text">传播、反射、透射、吸收与散射</text>

  <rect x="400" y="530" width="400" height="130" class="box" fill="#fae8ff" stroke="#a21caf"/>
  <text x="600" y="580" text-anchor="middle" class="label">声学超构材料</text>
  <text x="600" y="616" text-anchor="middle" class="text">人工结构单元调控声波</text>

  <rect x="70" y="530" width="240" height="130" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="190" y="580" text-anchor="middle" class="label">非线性声学</text>
  <text x="190" y="616" text-anchor="middle" class="small">谐波、畸变、强声场</text>

  <rect x="890" y="500" width="240" height="75" class="box" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="1010" y="546" text-anchor="middle" class="label">消费音频</text>
  <rect x="890" y="600" width="240" height="75" class="box" fill="#f0f9ff" stroke="#2563eb"/>
  <text x="1010" y="646" text-anchor="middle" class="label">医学超声</text>

  <path d="M360 280 L475 330" class="arrow"/>
  <path d="M840 280 L725 330" class="arrow"/>
  <path d="M600 460 L600 530" class="arrow"/>
  <path d="M310 595 L400 595" class="link"/>
  <path d="M800 570 L890 540" class="link"/>
  <path d="M800 620 L890 638" class="link"/>
  <text x="600" y="700" text-anchor="middle" class="small">先建立线性基础，再理解非线性为何出现；研究方向可交叉，不需要现在永久定型。</text>
</svg>
