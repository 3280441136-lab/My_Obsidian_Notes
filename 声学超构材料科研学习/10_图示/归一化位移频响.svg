  <g transform="translate(780 105)">
    <text x="0" y="0" class="label">曲线参数</text>
    <line x1="0" y1="31" x2="38" y2="31" stroke="#7a5195" stroke-width="4" stroke-dasharray="7 5"/><text x="50" y="37" class="note">Q → ∞</text>
    <line x1="0" y1="67" x2="38" y2="67" stroke="#d1495b" stroke-width="4"/><text x="50" y="73" class="note">Q = 3</text>
    <line x1="0" y1="103" x2="38" y2="103" stroke="#e28e2c" stroke-width="4"/><text x="50" y="109" class="note">Q = 1.5</text>
    <line x1="0" y1="139" x2="38" y2="139" stroke="#2a9d8f" stroke-width="4"/><text x="50" y="145" class="note">Q = 1</text>
    <line x1="0" y1="175" x2="38" y2="175" stroke="#64748b" stroke-width="4"/><text x="50" y="181" class="note">Q = 1/√2</text>
    <rect x="0" y="215" width="270" height="205" rx="6" fill="#f4f7fa" stroke="#c8d2df"/>
    <text x="16" y="246" class="label">读图要点</text>
    <text x="16" y="280" class="note">z → 0：A → 1</text>
    <text x="16" y="313" class="note">z = 1：A = Q</text>
    <text x="16" y="346" class="note">z → ∞：A ∼ 1/z²</text>
    <text x="16" y="379" class="note">Q ≤ 1/√2：无位移峰</text>
    <text x="16" y="408" class="note">Q = 1：峰值仅为 1.155</text>
  </g>
</svg>
