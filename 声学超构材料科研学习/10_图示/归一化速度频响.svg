  </g>
  <g transform="translate(780 105)">
    <text x="0" y="0" class="label">曲线参数</text>
    <line x1="0" y1="31" x2="38" y2="31" stroke="#7a5195" stroke-width="4" stroke-dasharray="7 5"/><text x="50" y="37" class="note">Q → ∞</text>
    <line x1="0" y1="67" x2="38" y2="67" stroke="#d1495b" stroke-width="4"/><text x="50" y="73" class="note">Q = 5</text>
    <line x1="0" y1="103" x2="38" y2="103" stroke="#2a9d8f" stroke-width="4"/><text x="50" y="109" class="note">Q = 1</text>
    <rect x="0" y="148" width="270" height="245" rx="6" fill="#f4f7fa" stroke="#c8d2df"/>
    <text x="16" y="179" class="label">读图要点</text>
    <text x="16" y="213" class="note">z → 0：B → 0</text>
    <text x="16" y="246" class="note">z = 1：B 达峰且 B = Q</text>
    <text x="16" y="279" class="note">z → ∞：B ∼ 1/z</text>
    <text x="16" y="312" class="note">速度峰位置与 Q 无关</text>
    <text x="16" y="345" class="note">相对半功率带宽 = 1/Q</text>
    <text x="16" y="378" class="note">Q = 1：峰高与归一值同为 1</text>
  </g>
</svg>
